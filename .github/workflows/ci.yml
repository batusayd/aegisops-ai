name: AegisOps AI — CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-verify:
    name: FastAPI + Qdrant RAG + HITL Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python modules
        run: |
          python -m py_compile app/config.py app/models/schemas.py \
            app/services/websocket_manager.py app/services/rag_service.py \
            app/services/ai_router.py app/services/hitl_engine.py \
            app/services/chat_moderator.py app/routers/tickets.py \
            app/routers/kb.py app/routers/chat.py app/main.py

      - name: Execute End-to-End Pipeline Smoke Test
        run: |
          python -c "
          import asyncio
          from app.services.rag_service import rag_service
          from app.services.hitl_engine import hitl_engine
          from app.services.chat_moderator import chat_moderator
          from app.routers.tickets import DEMO_TICKET_SCENARIOS
          from app.routers.chat import DEMO_CHAT_SEQUENCE

          async def main():
              kb = rag_service.ingest_seed_directory()
              assert kb['chunks_indexed'] >= 10
              t1 = await hitl_engine.ingest_and_process_ticket(DEMO_TICKET_SCENARIOS['duplicate_billing'])
              assert t1.state.value == 'PENDING_APPROVAL'
              t2 = await hitl_engine.ingest_and_process_ticket(DEMO_TICKET_SCENARIOS['high_value_escalation'])
              assert t2.mandatory_human_review is True
              approved, action = await hitl_engine.execute_magic_link_token(t1.action_token_approve)
              assert approved.state.value == 'APPROVED_AND_SENT'
              toxic = await chat_moderator.process_incoming_message(DEMO_CHAT_SEQUENCE[-1])
              assert toxic.moderation.is_safe is False
              digest = await chat_moderator.trigger_daily_digest()
              assert digest.total_messages_analyzed >= 1

          asyncio.run(main())
          "

  frontend-build:
    name: Next.js 14 TypeScript & Tailwind Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies & build Next.js production bundle
        run: |
          npm install
          npm run build
